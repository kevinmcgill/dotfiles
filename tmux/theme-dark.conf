# Dark theme: Catppuccin Macchiato
# Sourced by dark-notify when macOS switches to dark mode.
# Hardcodes Catppuccin Macchiato colors directly so this file is self-contained
# and does not depend on the catppuccin plugin running asynchronously.
#
# Color mapping from Catppuccin Macchiato palette:
#   bg          #24273a   base
#   overlay_0   #6e738d   overlay 0
#   surface_0   #363a4f   surface 0
#   rosewater   #f4dbd6   rosewater
#   red         #ed8796   red
#   green       #a6da95   green
#   peach       #f5a97f   peach
#   blue        #8aadf4   blue

# tmux 3.8 built-in UI (menus, popups, choose-tree, copy mode, prompts) reads
# the theme* colour names. Force the dark set to match dark-notify, and map
# the set to the Macchiato palette.
set -s theme dark
set -s dark-theme-black "#24273a"      # base
set -s dark-theme-white "#cad3f5"      # text
set -s dark-theme-light-grey "#a5adcb" # subtext 0
set -s dark-theme-dark-grey "#363a4f"  # surface 0
set -s dark-theme-red "#ed8796"        # red
set -s dark-theme-green "#a6da95"      # green
set -s dark-theme-yellow "#eed49f"     # yellow
set -s dark-theme-blue "#8aadf4"       # blue
set -s dark-theme-cyan "#8bd5ca"       # teal
set -s dark-theme-magenta "#c6a0f6"    # mauve

set -g status-position top
set -g status-style "bg=#24273a"

# pane border look and feel
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-border-indicators arrows
setw -g pane-active-border-style "bg=#24273a,fg=#6e738d"
setw -g pane-border-style "bg=#24273a,fg=#363a4f"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#24273a,fg=#f4dbd6"
set -g window-status-activity-style "bg=#ed8796,fg=#24273a"
set -g window-status-bell-style "bg=#ed8796,fg=#24273a,bold"
set -gF window-status-separator " "

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#f5a97f,fg=#24273a,bold"

# set status line contents
set -g status-left ""
set -g status-right ""
set -g status-right-length 100
# Session name: bold, inverted date colours; red background while the prefix is
# active. Do not put a comma in a #{?...} branch: tmux 3.8 expands a
# #{#[...] ...} branch to nothing.
set -ga status-right "#[fg=#24273a,bold]#{?client_prefix,#[bg=#ed8796],#[bg=#8aadf4]} 󰆍 #S #[nobold]"
set -ga status-right "#[bg=#24273a,fg=#8aadf4] 󰭦 %a %-d %b 󰅐 %H:%M %Z"
